<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKH Forward Chaining + Manual</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><h1>Kantor Desa</h1></div>
    <nav>
      <button data-page="dashboard" class="nav-btn active">Dashboard</button>
      <button data-page="input" class="nav-btn">Input Data</button>
      <button data-page="result" class="nav-btn">Hasil Rekomendasi</button>
    </nav>
    <div><button id="btnExport" class="btn btn-export" disabled>Export CSV</button></div>
  </aside>

  <div class="content-area">
    <main class="main-content">
      <section id="page-dashboard" class="page-section">
        <h2>Dashboard</h2>
        <p>Total data: <span id="totalData">0</span></p>
      </section>

      <section id="page-input" class="page-section hidden">
        <form id="formWarga" class="panel">
          <h3>Input Data Warga</h3>
          <div class="form-group"><label>Nama</label><input id="nama" required></div>
          <div class="form-group"><label>Skor Sistem</label><input id="skor" type="number" min="0" max="100" required></div>
          <div class="form-group">
            <label>Rekomendasi Manual</label>
            <select id="manualRekomendasi">
              <option value="">Biarkan sistem menentukan</option>
              <option value="Layak Diusulkan">Layak Diusulkan</option>
              <option value="Perlu Verifikasi">Perlu Verifikasi</option>
              <option value="Tidak Prioritas">Tidak Prioritas</option>
            </select>
          </div>
          <div class="form-group"><label>Keterangan Manual</label><input id="manualKeterangan" placeholder="Alasan rekomendasi manual"></div>
          <button type="submit" class="btn btn-primary">Simpan Data</button>
        </form>
      </section>

      <section id="page-result" class="page-section hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th><th>Nama</th><th>Skor</th><th>Rekomendasi Sistem</th>
                <th>Rekomendasi Manual</th><th>Keterangan Manual</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
const results=[];
const form = document.getElementById("formWarga");
form.addEventListener("submit", e=>{
  e.preventDefault();
  const nama = document.getElementById("nama").value;
  const skor = Number(document.getElementById("skor").value);
  const rekomManual = document.getElementById("manualRekomendasi").value || "Belum ada";
  const ketManual = document.getElementById("manualKeterangan").value || "-";
  let rekomSistem="Tidak Prioritas";
  if(skor>=70) rekomSistem="Layak Diusulkan";
  else if(skor>=50) rekomSistem="Perlu Verifikasi";
  results.push({nama, skor, rekomSistem, rekomManual, ketManual});
  renderTable();
  form.reset();
});

function renderTable(){
  const tbody = document.getElementById("resultBody");
  tbody.innerHTML = results.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${r.nama}</td>
      <td>${r.skor}</td>
      <td>${r.rekomSistem}</td>
      <td>${r.rekomManual}</td>
      <td>${r.ketManual}</td>
    </tr>
  `).join("");
  document.getElementById("totalData").textContent = results.length;
}
</script>
</body>
</html>
