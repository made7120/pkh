<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi PKH Forward Chaining + Manual</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-logo">KD</div>
      <div>
        <h1>Kantor Desa</h1>
        <p>Sistem Rekomendasi PKH</p>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button data-page="dashboard" class="nav-btn active">Dashboard</button>
      <button data-page="input" class="nav-btn">Input Data</button>
      <button data-page="result" class="nav-btn">Hasil Rekomendasi</button>
      <button data-page="weight" class="nav-btn">Bobot</button>
      <button data-page="rule" class="nav-btn">Aturan</button>
    </nav>
    <div class="sidebar-footer">
      <button id="btnExport" class="btn btn-export" disabled>Export CSV</button>
    </div>
  </aside>

  <!-- Konten utama -->
  <div class="content-area">
    <main class="main-content">

      <!-- Dashboard -->
      <section id="page-dashboard" class="page-section">
        <div class="summary-grid">
          <article class="summary-card">
            <p>Total Data</p>
            <h3 id="totalData">0</h3>
          </article>
          <article class="summary-card green">
            <p>Layak Diusulkan</p>
            <h3 id="totalLayak">0</h3>
          </article>
          <article class="summary-card yellow">
            <p>Perlu Verifikasi</p>
            <h3 id="totalVerifikasi">0</h3>
          </article>
          <article class="summary-card red">
            <p>Tidak Prioritas</p>
            <h3 id="totalTidak">0</h3>
          </article>
        </div>
      </section>

      <!-- Input Data -->
      <section id="page-input" class="page-section hidden">
        <form id="formWarga" class="panel">
          <h3>Input Data Warga</h3>
          <div class="form-grid">
            <div class="form-group"><label>Nama</label><input id="nama" required></div>
            <div class="form-group"><label>Umur</label><input id="umur" type="number" min="0" required></div>
            <div class="form-group"><label>RT</label><input id="rt" required></div>
            <div class="form-group"><label>Penghasilan</label>
              <select id="penghasilan">
                <option value="kurang_800">Kurang dari Rp800.000</option>
                <option value="800_1000">Rp800.000 - Rp1.000.000</option>
                <option value="1000_2000">Rp1.000.000 - Rp2.000.000</option>
                <option value="lebih_2000">Di atas Rp2.000.000</option>
              </select>
            </div>
            <div class="form-group"><label>Tanggungan Keluarga</label><input id="tanggungan" type="number" min="0" required></div>
            <div class="form-group"><label>Kondisi Rumah</label>
              <select id="kondisiRumah"><option value="tidak_layak">Tidak Layak</option><option value="layak">Layak</option></select>
            </div>
            <div class="form-group"><label>Aset Produktif</label>
              <select id="asetProduktif"><option value="tidak_ada">Tidak Ada</option><option value="ada">Ada</option></select>
            </div>
            <div class="form-group"><label>Kendaraan</label>
              <select id="kendaraan">
                <option value="tidak_ada">Tidak Ada</option>
                <option value="sepeda">Sepeda</option>
                <option value="motor">Motor</option>
                <option value="mobil">Mobil</option>
              </select>
            </div>
            <div class="form-group"><label>Status DTKS</label>
              <select id="dtks"><option value="terdaftar">Terdaftar</option><option value="belum">Belum Terdaftar</option></select>
            </div>

            <!-- Rekomendasi Manual -->
            <div class="form-group">
              <label>Rekomendasi Manual</label>
              <select id="manualRekomendasi">
                <option value="">Biarkan sistem menentukan</option>
                <option value="Layak Diusulkan">Layak Diusulkan</option>
                <option value="Perlu Verifikasi">Perlu Verifikasi</option>
                <option value="Tidak Prioritas">Tidak Prioritas</option>
              </select>
            </div>
            <div class="form-group"><label>Keterangan Manual</label><input id="manualKeterangan" placeholder="Alasan rekomendasi manual"></div>
          </div>
          <button type="submit" class="btn btn-primary">Simpan Data</button>
        </form>
      </section>

      <!-- Hasil Rekomendasi -->
      <section id="page-result" class="page-section hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th><th>Nama</th><th>Skor</th>
                <th>Rekomendasi Sistem</th>
                <th>Rekomendasi Manual</th>
                <th>Keterangan Manual</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script>
const results=[];

function getFormData(){
  return {
    nama: document.getElementById("nama").value,
    umur: Number(document.getElementById("umur").value),
    rt: document.getElementById("rt").value,
    penghasilan: document.getElementById("penghasilan").value,
    tanggungan: Number(document.getElementById("tanggungan").value),
    kondisiRumah: document.getElementById("kondisiRumah").value,
    asetProduktif: document.getElementById("asetProduktif").value,
    kendaraan: document.getElementById("kendaraan").value,
    dtks: document.getElementById("dtks").value,
    manualRekomendasi: document.getElementById("manualRekomendasi").value||"Belum ada",
    manualKeterangan: document.getElementById("manualKeterangan").value||"-"
  };
}

// Forward chaining sederhana
function computeRecommendation(data){
  let score=0;
  const details=[];
  if(data.penghasilan==="kurang_800") {score+=25;}
  else if(data.penghasilan==="800_1000") {score+=20;}
  if(data.kondisiRumah==="tidak_layak") {score+=20;}
  if(data.tanggungan>=4) {score+=15;} else if(data.tanggungan===3){score+=10;}
  if(data.asetProduktif==="tidak_ada") {score+=15;}
  if(data.kendaraan==="tidak_ada"||data.kendaraan==="sepeda") {score+=10;}
  if(data.dtks==="terdaftar") {score+=10;}
  if(data.umur>=60) {score+=10;}
  score=Math.min(100,score);
  let rekom="Tidak Prioritas";
  if(score>=70) rekom="Layak Diusulkan";
  else if(score>=50) rekom="Perlu Verifikasi";
  data.skor=score;
  data.rekomSistem=rekom;
  return data;
}

// Submit form
document.getElementById("formWarga").addEventListener("submit",e=>{
  e.preventDefault();
  let data=getFormData();
  data=computeRecommendation(data);
  results.push(data);
  renderTable();
  e.target.reset();
});

function renderTable(){
  const tbody=document.getElementById("resultBody");
  tbody.innerHTML=results.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${r.nama}</td>
      <td>${r.skor}</td>
      <td>${r.rekomSistem}</td>
      <td>${r.manualRekomendasi}</td>
      <td>${r.manualKeterangan}</td>
    </tr>
  `).join("");
  document.getElementById("totalData").textContent=results.length;
}
</script>

</body>
</html>
