<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Petugas PKH</title>
<link rel="stylesheet" href="style.css">
<style>
#page-login{display:flex; justify-content:center; align-items:center; height:100vh;}
#page-login form{width:300px;}
</style>
</head>
<body>
<section id="page-login">
  <form id="formLogin" class="panel">
    <h3>Login Petugas</h3>
    <div class="form-group">
      <label>Username</label>
      <input id="loginUser" type="text" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="loginPass" type="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
</section>
<script>
document.getElementById("formLogin").addEventListener("submit",e=>{
  e.preventDefault();
  const u=document.getElementById("loginUser").value;
  const p=document.getElementById("loginPass").value;
  if(u==="petugas" && p==="1234"){ window.location.href="index.html"; }
  else alert("Username atau password salah!");
});
</script>
</body>
</html>
